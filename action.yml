name: 'Intentions'
description: 'Coordinate who works on what: claim/disclaim tasks via issue comments, with configurable claim expiry (TTL).'
author: 'leanprover-community'

inputs:
  mode:
    description: 'What to run: "command" (handle an issue_comment), "lifecycle" (react to issue/PR events), or "sweep" (expire stale claims).'
    required: true
  project-token:
    description: 'GitHub App installation token (preferred for orgs) or fine-grained PAT that can write the Projects v2 board. The default GITHUB_TOKEN cannot write org-level Projects v2. Used for Issue/PR writes too unless repo-token is set.'
    required: true
  repo-token:
    description: 'Token for Issue/PR REST writes and repo-level GraphQL reads (assign, comment, link PRs). The reusable workflow passes the job GITHUB_TOKEN here so the project-token only needs Projects access. Falls back to project-token when empty.'
    required: false
    default: ''
  project-title:
    description: 'Title of the GitHub Projects v2 board to drive.'
    required: true
  status-field:
    description: 'Name of the single-select board field tracking task state.'
    required: false
    default: 'Status'
  status-unclaimed:
    description: 'Name of the "unclaimed" option of the status field.'
    required: false
    default: 'Unclaimed'
  status-claimed:
    description: 'Name of the "claimed" option of the status field.'
    required: false
    default: 'Claimed'
  status-in-progress:
    description: 'Name of the "in progress" option of the status field (a draft PR is open).'
    required: false
    default: 'In Progress'
  status-in-review:
    description: 'Name of the "in review" option (lifecycle moves a task here when a ready PR is open). Skipped if the board has no such option.'
    required: false
    default: 'In Review'
  status-completed:
    description: 'Name of the "completed" option (lifecycle moves a task here when its PR merges or the issue closes). Skipped if the board has no such option.'
    required: false
    default: 'Completed'
  auto-add:
    description: 'In lifecycle mode, add newly opened issues to the board as Unclaimed.'
    required: false
    default: 'true'
  auto-add-labels:
    description: 'Comma-separated label allowlist for auto-add. Empty adds every opened issue; otherwise only issues carrying one of these labels are added (e.g. "intention").'
    required: false
    default: ''
  claim-on-open:
    description: 'In lifecycle mode, auto-claim a newly opened (auto-added) issue for its author, so registering needs only the issue form and no separate `claim` comment.'
    required: false
    default: 'false'
  claim-expiry-field:
    description: 'Issue-form field label to read the auto-claim expiry from (e.g. "Credible expiry date"). Empty, missing, or unparseable falls back to default-ttl. Only used when claim-on-open is true.'
    required: false
    default: ''
  claim-expiry-require-date:
    description: 'Require the claim-expiry-field value to be an absolute date (e.g. "2026-09-01"); a duration like "6 months" is refused and falls back to default-ttl. Keeps the recorded expiry a date a reader can see without knowing the claim date. Only used when claim-on-open is true.'
    required: false
    default: 'false'
  claim-participants-field:
    description: 'Issue-form field label listing co-participants'' GitHub handles (e.g. "Participants"). On open (with claim-on-open), everyone listed that GitHub accepts as an assignee is registered alongside the author; afterwards, anyone listed there may comment `claim` to join the active registration as a co-holder. Empty disables both.'
    required: false
    default: ''
  participant-claim:
    description: 'Let the issue author, and anybody listed in claim-participants-field, `claim` from any column instead of only a free one. Intended for registry boards, where the person who registered an intention should never be told it is unavailable; everybody else stays bound by the ordinary status rules, so a free card can still be picked up by a newcomer.'
    required: false
    default: 'false'
  enforce-holder:
    description: 'Have the sweep keep the board well-formed: give every card a column (a card with holders goes to the claimed status, one without to the unclaimed status), and assign the issue author to any card in an active column that has no assignee. The author is a fallback only, applied when the assignee list is empty, so explicit choices are never overwritten.'
    required: false
    default: 'false'
  notify-maintainers:
    description: 'Comma-separated logins to cc when the enforce-holder reconciliation repairs a malformed card (e.g. "alice,bob"). Empty posts the repair note without mentioning anybody. Only successful repairs are announced, and each is announced once.'
    required: false
    default: ''
  status-commands:
    description: 'Enable the `progress` / `review` / `done` comment commands, which let a holder move their own card between columns without a pull request. Off by default so ordinary words cannot move a board that has not opted in.'
    required: false
    default: 'false'
  terminal-statuses:
    description: 'Comma-separated status names the bot recognizes but does not manage (claims here are refused cleanly).'
    required: false
    default: 'In Review,Completed'
  expiry-field:
    description: 'Name of the board Text field that stores each claim''s expiry as an ISO 8601 UTC datetime (the machine source of truth).'
    required: false
    default: 'Claim Expires'
  note-field:
    description: 'Name of the board Text field that holds each claim''s freeform note (scraped from the lines following a `claim` comment). Optional: if the board has no such field, notes are silently ignored.'
    required: false
    default: 'Claim Note'
  default-ttl:
    description: 'TTL applied to a bare `claim`. Accepts a duration (e.g. 1h, 7d, 3 weeks, 30d). Set to "none" or "off" to disable expiry entirely for this project.'
    required: false
    default: '30d'
  max-ttl:
    description: 'Maximum TTL a claimant may request; longer requests are rejected with a helpful message.'
    required: false
    default: '90d'
  expiry-warning:
    description: 'How long before an expiry its holders are warned, as a duration such as "7d". The sweep then posts one comment upon the issue, mentioning every assignee together with the logins in notify-maintainers, so that GitHub notifies each of them; a mention is the only means by which an Action can cause electronic mail to be sent. Each recorded expiry is warned of once. Empty, the default, asks for no warning.'
    required: false
    default: ''
  expire-in-progress:
    description: 'Whether the sweep also expires items in the "in progress" status (an open PR was proposed).'
    required: false
    default: 'false'
  backfill-legacy:
    description: 'How the sweep treats Claimed items with an empty expiry (legacy claims): "grace" (set now+default-ttl, skip one round), "ignore" (never touch), or "expire".'
    required: false
    default: 'grace'

runs:
  using: 'node24'
  main: 'dist/index.js'
